# This workflow automatically updates the URLs for the GitHub stats images
# in the README.md file to ensure they are always fresh.

name: Auto Update GitHub Stats

on:
  schedule:
    # Runs every 6 hours to keep the stats reasonably up-to-date.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README stats URLs
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          CACHE_BUSTER=$RANDOM
          echo "Updating README for user: $GH_OWNER with cache buster: $CACHE_BUSTER"

          # --- Main Stats Card (Official) ---
          sed -i "s|https://github-readme-stats.vercel.app/api?username=[^\"]*|https://github-readme-stats.vercel.app/api?username=${GH_OWNER}\&count_private=true\&theme=dark\&show_icons=true\&icon_color=blue\&rand=${CACHE_BUSTER}|g" README.md
          
          # --- Top Languages Card (Official) ---
          sed -i "s|https://github-readme-stats.vercel.app/api/top-langs/\?username=[^\"]*|https://github-readme-stats.vercel.app/api/top-langs/?username=${GH_OWNER}\&layout=compact\&langs_count=10\&theme=dark\&count_private=true\&rand=${CACHE_BUSTER}|g" README.md

          # --- Streak Stats Card ---
          sed -i "s|https://streak-stats.demolab.com\?user=[^\"]*|https://streak-stats.demolab.com?user=${GH_OWNER}\&include_all_commits=true\&hide_border=true\&rand=${CACHE_BUSTER}|g" README.md
          
          # --- Activity Graph ---
          sed -i "s|https://github-readme-activity-graph.vercel.app/graph\?username=[^\"]*|https://github-readme-activity-graph.vercel.app/graph?username=${GH_OWNER}\&theme=react-dark\&hide_border=true\&area=true\&rand=${CACHE_BUSTER}|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "Auto-refresh GitHub Stats URLs [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

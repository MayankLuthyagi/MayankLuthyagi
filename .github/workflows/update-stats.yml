name: Auto Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate random number
        id: rand
        run: echo "RAND=$RANDOM" >> $GITHUB_ENV

      - name: Update README stats URLs
        run: |
          RAND=$RANDOM
          echo "Updating README.md with RAND=$RAND"
          
          # Update GitHub Stats URL
          sed -i "s|https://github-readme-stats.vercel.app/api?username=MayankLuthyagi.*|https://github-readme-stats.vercel.app/api?username=MayankLuthyagi&count_private=true&include_all_commits=true&cache_seconds=1&rand=$RAND|g" README.md
          
          # Update Streak Stats URL
          sed -i "s|https://streak-stats.demolab.com?user=MayankLuthyagi.*|https://streak-stats.demolab.com?user=MayankLuthyagi&include_all_commits=true&rand=$RAND|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-refresh GitHub Stats URLs [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main

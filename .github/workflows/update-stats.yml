name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *" # runs every 6 hours
  workflow_dispatch: # lets you trigger it manually from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Curl GitHub Stats
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=MayankLuthyagi&count_private=true&include_all_commits=true&cache_seconds=1800&v=1"
          curl -s "https://streak-stats.demolab.com?user=MayankLuthyagi&include_all_commits=true"
